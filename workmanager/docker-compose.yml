services:
  mysql:
    image: mysql:8.0
    container_name: workmanager-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - workmanager-mysql-data:/var/lib/mysql
  redis:
    image: redis:7
    container_name: workmanager-redis
    ports:
      - "6379:6379"
    volumes:
      - workmanager-redis-data:/data

volumes:
  workmanager-mysql-data:
  workmanager-redis-data:
